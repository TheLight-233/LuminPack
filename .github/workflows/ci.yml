name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Source-level repository checks only. These parse the working tree, so they
  # run once on a single platform instead of in the multi-platform matrix.
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # LuminPack.RepositoryChecks and the documentation test target net11.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Run repository checks
        run: dotnet run --project tools/LuminPack.RepositoryChecks/LuminPack.RepositoryChecks.csproj -c Release -- .

  # Full build and behavioral verification across operating systems.
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Target frameworks in scope: netstandard2.0/2.1, net8.0, net9.0,
      # net10.0 and net11.0 (preview). Runtimes for net8.0/net9.0/net10.0 come
      # from their own SDKs; the net11.0 targets need the preview SDK.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            LuminPack.sln

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Show resolved SDK
        run: dotnet --version

      - name: Build solution (Release)
        run: dotnet build LuminPack.sln -c Release

      - name: Documentation regression
        run: dotnet run --project tests/LuminPackDocumentationTest/LuminPackDocumentationTest.csproj -c Release

      - name: Generator and emitter-shape regressions
        run: dotnet run --project tests/LuminPackGeneratorConcurrencyTest/LuminPackGeneratorConcurrencyTest.csproj -c Release

      - name: Incremental generation verification
        run: dotnet run --project tests/LuminPackGeneratorConcurrencyTest/LuminPackGeneratorConcurrencyTest.csproj -c Release -- --verify-incremental

      - name: Unit tests
        run: dotnet test tests/LuminPackUnitTest/LuminPackUnitTest.csproj -c Release

      # Captures wire fixtures with the current build and verifies them back.
      - name: Wire compatibility artifact check
        run: |
          dotnet run --project tests/LuminPackWireCompatibility/LuminPackWireCompatibility.csproj -c Release -- write .tmp/wire-baseline
          dotnet run --project tests/LuminPackWireCompatibility/LuminPackWireCompatibility.csproj -c Release -- verify .tmp/wire-baseline

  # 32-bit execution coverage. GitHub-hosted Windows runners are 64-bit only, so
  # this job targets a self-hosted Windows runner carrying the custom `x86`
  # label. The repository's established x86 procedure is the net9 win-x86 RID:
  # net9 is the newest modern runtime target that ships a 32-bit Windows runtime.
  x86-windows:
    name: Build and test (net9 win-x86, self-hosted)
    # Manual dispatch only: routine pushes and pull requests must not queue work
    # on the single self-hosted machine.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x86]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The solution carries net11.0 targets; the x86 run needs the net9 SDK and
      # the net10 SDK for the remaining test targets.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # The win-x86 run is framework-dependent, so the runner itself must have
      # the 32-bit .NET 9 runtime installed. Fail early with an actionable
      # message instead of letting the test invocation silently skip.
      - name: Verify the 32-bit .NET 9 runtime prerequisite
        shell: pwsh
        run: |
          $root = Join-Path ${env:ProgramFiles(x86)} 'dotnet\shared\Microsoft.NETCore.App'
          $runtime = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -like '9.*' | Select-Object -First 1
          if (-not $runtime) {
            throw "No 32-bit .NET 9 runtime found under '$root'. Install the win-x86 .NET 9 runtime on this runner before the x86 job can execute."
          }
          Write-Host "32-bit runtime: $($runtime.FullName)"

      - name: Build solution (Release)
        run: dotnet build LuminPack.sln -c Release

      # Both the framework and RID selectors are required: `-f net9.0` keeps the
      # restore scoped to the x86-capable target, and `-r win-x86` restores the
      # win-x86 assets and runs the suite in a 32-bit process. Without the RID
      # (or with --no-restore) the tests are skipped rather than executed.
      - name: Unit tests (net9.0, win-x86)
        run: dotnet test tests/LuminPackUnitTest/LuminPackUnitTest.csproj -c Release -f net9.0 -r win-x86 --results-directory .tmp/x86-results --logger "trx;LogFileName=x86-net9.trx"

      - name: Upload x86 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-test-results
          path: .tmp/x86-results
          if-no-files-found: warn
