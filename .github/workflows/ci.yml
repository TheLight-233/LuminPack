name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run the four timing benchmarks on x64, Intel x64 and ARM64 hosts
        type: boolean
        default: false
      benchmark_jit:
        description: Separate production PGO timings from the FullOpts stability control
        type: choice
        options: [both, tiered, fullopts]
        default: both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Source-level repository checks only. These parse the working tree, so they
  # run once on a single platform instead of in the multi-platform matrix.
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow definitions
        uses: docker://rhysd/actionlint:1.7.12

      # LuminPack.RepositoryChecks and the generated-code contract tests target net11.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Run repository checks
        run: dotnet run --project tools/LuminPack.RepositoryChecks/LuminPack.RepositoryChecks.csproj -c Release -- .

      - name: Check benchmark process analysis
        run: python3 -m unittest discover -s .github/scripts -p 'test_analyze_benchmarks.py'

      - name: Audit dependency advisories
        run: dotnet restore LuminPack.sln -p:NuGetAuditMode=all -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904

  # Full build and behavioral verification across operating systems.
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Target frameworks in scope: netstandard2.0/2.1, net8.0, net9.0,
      # net10.0 and net11.0 (preview). Runtimes for net8.0/net9.0/net10.0 come
      # from their own SDKs; the net11.0 targets need the preview SDK.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            LuminPack.sln

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Show resolved SDK
        run: dotnet --version

      - name: Build solution (Release)
        # Adapter projects consume an existing Core binary rather than a project reference.
        # Build that dependency explicitly before the solution's parallel build starts.
        run: dotnet build src/LuminPack.Core/LuminPack.Core.csproj -c Release

      - name: Build complete solution (Release)
        run: dotnet build LuminPack.sln -c Release

      - name: Generated code contracts
        run: dotnet run --project tests/LuminPack.Tests.Codegen/LuminPack.Tests.Codegen.csproj -c Release

      - name: Generator and emitter-shape regressions
        run: dotnet run --project tests/LuminPack.Tests.Generator/LuminPack.Tests.Generator.csproj -c Release

      - name: Incremental generation verification
        run: dotnet run --project tests/LuminPack.Tests.Generator/LuminPack.Tests.Generator.csproj -c Release -- --verify-incremental

      - name: Unit tests
        run: dotnet test tests/LuminPack.Tests/LuminPack.Tests.csproj -c Release --no-build --logger trx --results-directory .tmp/test-results

      - name: Core netstandard native hook contracts
        run: dotnet test tests/LuminPack.Tests/LuminPack.Tests.csproj -c Release -f net10.0 -p:LuminPackTestArea=Hooks --logger trx --results-directory .tmp/hook-test-results

      # Read the retained fixtures and compare newly written bytes against them.
      - name: Wire compatibility artifact check
        run: |
          dotnet run --project tests/LuminPack.Tests.Aot/LuminPack.Tests.Aot.csproj -c Release --no-build -- --wire verify tests/LuminPack.Tests.Aot/Fixtures

      - name: Pack and verify installation from NuGet packages
        shell: pwsh
        run: |
          $feed = Join-Path $env:GITHUB_WORKSPACE '.tmp/package-feed'
          $cache = Join-Path $env:GITHUB_WORKSPACE '.tmp/package-cache'
          dotnet pack src/LuminPack.Generator/LuminPack.Generator.csproj -c Release --no-build --no-restore -p:Version=0.0.0-ci -o $feed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/LuminPack.Core/LuminPack.Core.csproj -c Release --no-build --no-restore -p:Version=0.0.0-ci -o $feed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $configPath = Join-Path $feed 'NuGet.Config'
          $config = [xml]'<configuration><packageSources><clear /><add key="local" value="" /><add key="nuget" value="https://api.nuget.org/v3/index.json" /></packageSources><packageSourceMapping><packageSource key="local"><package pattern="LuminPack*" /></packageSource><packageSource key="nuget"><package pattern="*" /></packageSource></packageSourceMapping></configuration>'
          $config.configuration.packageSources.add[0].SetAttribute('value', $feed)
          $config.Save($configPath)
          dotnet restore tests/LuminPack.Tests.Aot/LuminPack.Tests.Aot.csproj -p:LuminPackPackageVersion=0.0.0-ci --configfile $configPath --packages $cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/LuminPack.Tests.Aot/LuminPack.Tests.Aot.csproj -c Release --no-restore -p:LuminPackPackageVersion=0.0.0-ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            .tmp/test-results
            .tmp/hook-test-results
          if-no-files-found: error

  # Compare libraries within each native host; absolute times across operating
  # systems and CPU families are not directly comparable.
  benchmark:
    name: Benchmark (${{ matrix.host }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-latest
            arch: x64
            vendor: any
          - host: intel-x64
            runner: macos-15-intel
            arch: x64
            vendor: GenuineIntel
          - host: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            vendor: any
    steps:
      - uses: actions/checkout@v4

      # The benchmark project targets net10.0 only; the solution it references
      # also carries net11.0 targets, so install the preview SDK alongside it.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            LuminPack.sln

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build benchmarks
        run: dotnet build benchmarks/LuminPack.Benchmark/LuminPack.Benchmark.csproj -c Release -f net10.0 -p:PublishAot=false -p:GeneratePackageOnBuild=false -p:UseSharedCompilation=false

      - name: Verify native benchmark host and record its runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/benchmark-artifacts
          dotnet run --project benchmarks/LuminPack.Benchmark/LuminPack.Benchmark.csproj -c Release -f net10.0 --no-build -- --verify-host '${{ matrix.arch }}' '${{ matrix.vendor }}' | tee .tmp/benchmark-artifacts/host.txt
          dotnet --info > .tmp/benchmark-artifacts/dotnet-info.txt

      - name: Verify identical fixture bytes across processes and repeated setup
        shell: bash
        run: |
          set -euo pipefail
          benchmark=benchmarks/LuminPack.Benchmark/bin/Release/net10.0/LuminPack.Benchmark.dll
          dotnet "$benchmark" --verify-fixtures > .tmp/benchmark-artifacts/fixtures-first.txt
          dotnet "$benchmark" --verify-fixtures > .tmp/benchmark-artifacts/fixtures-second.txt
          diff -u .tmp/benchmark-artifacts/fixtures-first.txt .tmp/benchmark-artifacts/fixtures-second.txt

      # Keep the selection explicit and restricted to the four maintained classes.
      - name: Run benchmarks
        shell: bash
        env:
          LUMINPACK_BENCHMARK_JIT: ${{ inputs.benchmark_jit }}
        run: dotnet run --project benchmarks/LuminPack.Benchmark/LuminPack.Benchmark.csproj -c Release -f net10.0 --no-build -- --filter 'LuminPackBenchmark.SimpleBenchmark.*' 'LuminPackBenchmark.SerializeBenchmark.*' 'LuminPackBenchmark.JsonBenchmark.*' 'LuminPackBenchmark.PolymorphismBenchmark.*' --artifacts "$GITHUB_WORKSPACE/.tmp/benchmark-artifacts" --buildTimeout 600

      - name: Report process dispersion and reference ratios
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 .github/scripts/analyze_benchmarks.py .tmp/benchmark-artifacts --summary "$GITHUB_STEP_SUMMARY"

      # Capture separately from timing so JIT logging cannot affect the benchmark results.
      - name: Capture polymorphism JIT assembly
        if: matrix.host != 'intel-x64'
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_gcServer=1 DOTNET_TieredCompilation=1 DOTNET_TieredPGO=1
          artifacts="$GITHUB_WORKSPACE/.tmp/benchmark-artifacts"
          benchmark="$GITHUB_WORKSPACE/benchmarks/LuminPack.Benchmark/bin/Release/net10.0/LuminPack.Benchmark.dll"
          for operation in lumin-write lumin-read nino-write nino-read; do
            case "$operation" in
              lumin-write)
                export DOTNET_JitDisasm='*LuminPackSerialize* *RootWrite* *__LuminPackUnionSerialize*'
                required='LuminPackBenchmark[.]FooA:__LuminPackUnionSerialize.*\(Tier1'
                ;;
              lumin-read)
                export DOTNET_JitDisasm='*LuminPackDeserialize* *RootRead* *TryPeekUnionHeader*'
                required=''
                ;;
              nino-write)
                export DOTNET_JitDisasm='*NinoSerialize* *__WriteSubtype* *WriteEach* *WriteRawBody*'
                required='LuminPackBenchmark_IFooFormatter:__WriteSubtype.*\(Tier1'
                ;;
              nino-read)
                export DOTNET_JitDisasm='*NinoDeserialize* *__ReadSubtype* *__ReadExact* *ReadEach* *ReadBody*'
                required='LuminPackBenchmark_IFooFormatter:__ReadExact.*\(Tier1'
                ;;
            esac
            assembly="$artifacts/jit-$operation.asm"
            metadata="$artifacts/jit-$operation.log"
            if ! dotnet "$benchmark" --polymorphism-native-probe "$operation" >"$assembly" 2>"$metadata"; then
              cat "$metadata"
              exit 1
            fi
            cat "$metadata"
            if [[ "$operation" == lumin-read ]]; then
              list_root=$(sed -n 's/^Generated root: .*\(__LuminRoots_[0-9a-f]*\):RootRead; parameter: System.Collections.Generic.List.*/\1/p' "$metadata")
              if [[ -z "$list_root" ]]; then
                echo 'The generated polymorphic list reader was not identified.' >&2
                exit 1
              fi
              required="${list_root}:RootRead.*\\(Tier1"
            fi
            if ! grep -Eq "$required" "$assembly"; then
              echo "The optimized $operation target was not captured in $assembly." >&2
              exit 1
            fi
          done

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts-${{ matrix.host }}
          path: .tmp/benchmark-artifacts
          if-no-files-found: warn
