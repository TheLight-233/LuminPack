name: CI 57 FullOpts baseline matrix

on:
  push:
    branches: [codex/ci57-fullopts-baseline]

permissions:
  contents: read

concurrency:
  group: ci57-fullopts-baseline-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DOTNET_TieredCompilation: '0'
      DOTNET_TieredPGO: '0'
      DOTNET_PROCESSOR_COUNT: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build the matrix
        run: >
          dotnet build benchmarks/LuminPack.MatrixBenchmark -c Release
          -p:LuminPackLegacyGeneratorReference=false -p:LuminPackUseSatori=false
          -p:GeneratePackageOnBuild=false
      - name: Validate fixtures and sample the matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/matrix-artifacts
          dotnet --info > .tmp/matrix-artifacts/dotnet-info.txt
          lscpu > .tmp/matrix-artifacts/cpu.txt
          dll=benchmarks/LuminPack.MatrixBenchmark/bin/Release/net10.0/LuminPack.MatrixBenchmark.dll
          rounds=9
          processes=3
          for format in binary json; do
            for scene in main small regular large changing; do
              for ((process=1; process<=processes; process++)); do
                dotnet "$dll" "$format" "$scene" "$rounds" ".tmp/matrix-artifacts/$format-$scene-$process.jsonl"
              done
            done
          done
      - name: Summarize the matrix
        run: |
          python3 benchmarks/LuminPack.MatrixBenchmark/report.py .tmp/matrix-artifacts
          cat .tmp/matrix-artifacts/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload matrix data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci57-fullopts-baseline
          path: .tmp/matrix-artifacts
