name: Portable language benchmarks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  fixtures:
    name: Export the managed benchmark fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: python3 benchmarks/LuminPack.Benchmark.Portable/prepare.py .tmp/portable-benchmark/models --cpp --generated
      - uses: actions/upload-artifact@v4
        with:
          name: portable-benchmark-fixtures
          path: .tmp/portable-benchmark/models/
          if-no-files-found: error

  benchmark:
    name: Compare ${{ matrix.language }} libraries
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, java, go, typescript, rust, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-benchmark-fixtures
          path: .tmp/portable-benchmark/models
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: benchmarks/LuminPack.Benchmark.Go/go.mod
          cache-dependency-path: benchmarks/LuminPack.Benchmark.Go/go.sum
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: matrix.language == 'python' || matrix.language == 'rust'
        with:
          python-version: '3.13'
      - name: Record runner information
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          mkdir -p .tmp/portable-benchmark/results
          lscpu > ".tmp/portable-benchmark/results/$LANGUAGE-cpu.txt"
          uname -a > ".tmp/portable-benchmark/results/$LANGUAGE-os.txt"
      - name: Build native model libraries for the JSON operations
        if: matrix.language == 'rust' || matrix.language == 'python'
        run: |
          export LP_MODELS="$PWD/.tmp/portable-benchmark/models"
          echo "LP_MODELS=$LP_MODELS" >> "$GITHUB_ENV"
          for model in simple serialize; do
            build=".tmp/native-$model"
            cmake -S src/LuminPack.Native -B "$build" -DCMAKE_BUILD_TYPE=Release -DLUMINPACK_HEADER="$LP_MODELS/$model-benchmark.hpp"
            cmake --build "$build" --target luminpack_model --parallel 2
            cp "$build/libluminpack_model.so" "$LP_MODELS/$model.so"
          done
      - name: Benchmark Rust
        if: matrix.language == 'rust'
        run: |
          rustc -Vv > .tmp/portable-benchmark/results/rust-runtime.txt
          cargo run --locked --release --manifest-path benchmarks/LuminPack.Benchmark.Rust/Cargo.toml > .tmp/portable-benchmark/results/rust.csv
      - name: Benchmark Python
        if: matrix.language == 'python'
        run: |
          python -m pip install 'Cython>=3,<4' setuptools msgspec msgpack orjson ./src/LuminPack.Python
          python --version > .tmp/portable-benchmark/results/python-runtime.txt
          python -m pip freeze >> .tmp/portable-benchmark/results/python-runtime.txt
          for model in simple serialize; do
            python tools/portable-direct/build_python.py "$LP_MODELS/$model.manifest.json" "$model" "$LP_MODELS"
          done
          python benchmarks/LuminPack.Benchmark.Python/benchmark.py > .tmp/portable-benchmark/results/python.csv
      - name: Benchmark C++
        if: matrix.language == 'cpp'
        run: bash benchmarks/LuminPack.Benchmark.Portable/run-cpp.sh .tmp/portable-benchmark/models .tmp/portable-benchmark/results
      - name: Benchmark Java
        if: matrix.language == 'java'
        run: |
          java -version 2> .tmp/portable-benchmark/results/java-runtime.txt
          python3 benchmarks/LuminPack.Benchmark.Java/run.py .tmp/portable-benchmark/models .tmp/portable-benchmark/results/java.csv
      - name: Benchmark Go
        if: matrix.language == 'go'
        working-directory: benchmarks/LuminPack.Benchmark.Go
        run: |
          go version > ../../.tmp/portable-benchmark/results/go-runtime.txt
          cp -r ../../.tmp/portable-benchmark/models/go generated
          go run -tags luminpack_generated . ../../.tmp/portable-benchmark/models ../../.tmp/portable-benchmark/results/go.csv
      - name: Benchmark TypeScript
        if: matrix.language == 'typescript'
        run: |
          node --version > .tmp/portable-benchmark/results/typescript-runtime.txt
          npm ci --prefix src/LuminPack.TypeScript
          npm run build --prefix src/LuminPack.TypeScript
          npm ci --prefix benchmarks/LuminPack.Benchmark.TypeScript
          cp -r .tmp/portable-benchmark/models/typescript benchmarks/LuminPack.Benchmark.TypeScript/generated
          src/LuminPack.TypeScript/node_modules/.bin/tsc --strict --target ES2022 --module NodeNext --moduleResolution NodeNext benchmarks/LuminPack.Benchmark.TypeScript/generated/*.ts
          node benchmarks/LuminPack.Benchmark.TypeScript/benchmark.mjs --generated .tmp/portable-benchmark/models .tmp/portable-benchmark/results/typescript.csv
      - uses: actions/upload-artifact@v4
        with:
          name: portable-benchmark-raw-${{ matrix.language }}
          path: |
            .tmp/portable-benchmark/results/*.csv
            .tmp/portable-benchmark/results/*.txt
          if-no-files-found: error

  charts:
    name: Render benchmarks for the README
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-benchmark-raw-*
          path: .tmp/portable-benchmark/raw
          merge-multiple: true
      - name: Render light and dark charts
        run: |
          work=.tmp/portable-benchmark
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 benchmarks/LuminPack.Benchmark.Portable/chart.py "$work/charts" \
            --input "$work/raw/cpp.csv" --input "$work/raw/java.csv" --input "$work/raw/go.csv" \
            --input "$work/raw/typescript.csv" --input "$work/raw/rust.csv" --input "$work/raw/python.csv" --source-url "$source" --host 'GitHub Actions Ubuntu x64'
          printf '{"source_url":"%s","commit":"%s"}\n' "$source" "$GITHUB_SHA" > "$work/charts/provenance.json"
          echo 'Download `portable-benchmark-charts` for the six light/dark chart pairs and summary.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-benchmark-charts
          path: .tmp/portable-benchmark/charts/
          if-no-files-found: error
