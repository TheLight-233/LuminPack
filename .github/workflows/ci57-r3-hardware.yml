name: CI 57 targeted hardware probes

on: workflow_dispatch

permissions:
  contents: read

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-latest }
          - { name: intel-x64, runner: macos-15-intel }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.name == 'linux-x64' && vars.LUMINPACK_AVX512_RUNNER || matrix.runner }}
    timeout-minutes: 35
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      DOTNET_TieredCompilation: '0'
      DOTNET_TieredPGO: '0'
    steps:
      - uses: actions/checkout@v4
        with: { path: stock, persist-credentials: false }
      - uses: actions/checkout@v4
        if: matrix.name == 'linux-x64'
        with: { path: gated, persist-credentials: false }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: python3 stock/.github/scripts/ci57-r3-hardware.py stock gated results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci57-r3-${{ matrix.name }}
          path: |
            results/*.txt
            results/*.jsonl
            results/*.csv
