name: Benchmark matrix

on:
  pull_request:
    paths:
      - 'benchmarks/LuminPack.MatrixBenchmark/**'
      - 'src/**'
      - 'eng/**'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/benchmark-matrix.yml'
  push:
    branches: [main, refactor]
    paths:
      - 'benchmarks/LuminPack.MatrixBenchmark/**'
      - 'src/**'
      - 'eng/**'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/benchmark-matrix.yml'
  workflow_dispatch:
    inputs:
      jit:
        description: JIT configurations to time
        type: choice
        options: [both, tiered, fullopts]
        default: both
  workflow_call:
    inputs:
      jit:
        description: JIT configurations to time
        type: string
        default: both

permissions:
  contents: read

concurrency:
  group: benchmark-matrix-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix (${{ matrix.jit }})
    runs-on: ubuntu-latest
    timeout-minutes: 225
    strategy:
      fail-fast: false
      matrix:
        jit: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["Validation"]' || inputs.jit == 'tiered' && '["TieredPGO"]' || inputs.jit == 'fullopts' && '["FullOpts"]' || '["TieredPGO","FullOpts"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build the matrix
        run: >
          dotnet build benchmarks/LuminPack.MatrixBenchmark -c Release
          -p:LuminPackUseSatori=false
          -p:GeneratePackageOnBuild=false
      - name: Validate fixtures and sample the matrix
        shell: bash
        env:
          TIMING: ${{ matrix.jit != 'Validation' }}
          DOTNET_TieredCompilation: ${{ matrix.jit == 'TieredPGO' && '1' || '0' }}
          DOTNET_TieredPGO: ${{ matrix.jit == 'TieredPGO' && '1' || '0' }}
          DOTNET_TC_QuickJit: ${{ matrix.jit == 'TieredPGO' && '1' || '0' }}
          DOTNET_TC_QuickJitForLoops: ${{ matrix.jit == 'TieredPGO' && '1' || '0' }}
          DOTNET_TC_CallCountingDelayMs: '0'
        run: |
          set -euo pipefail
          mkdir -p .tmp/matrix-artifacts
          dotnet --info > .tmp/matrix-artifacts/dotnet-info.txt
          lscpu > .tmp/matrix-artifacts/cpu.txt
          dll=benchmarks/LuminPack.MatrixBenchmark/bin/Release/net10.0/LuminPack.MatrixBenchmark.dll
          rounds=0
          processes=1
          if [[ "$TIMING" == true ]]; then
            rounds=9
            processes=3
          fi
          for format in binary json; do
            for scene in main small regular large changing; do
              for ((process=1; process<=processes; process++)); do
                echo "Sampling $format/$scene, process $process of $processes ($rounds rounds)"
                dotnet "$dll" "$format" "$scene" "$rounds" ".tmp/matrix-artifacts/$format-$scene-$process.jsonl"
              done
            done
          done
      - name: Summarize the matrix
        run: |
          python3 benchmarks/LuminPack.MatrixBenchmark/report.py .tmp/matrix-artifacts
          cat .tmp/matrix-artifacts/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload matrix data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jit == 'FullOpts' && 'benchmark-matrix-fullopts' || 'benchmark-matrix' }}
          path: .tmp/matrix-artifacts
